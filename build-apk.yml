name: Build APK

# هر بار که به شاخه main پوش کنید، یا دستی از تب Actions اجرا کنید
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد از مخزن
        uses: actions/checkout@v4

      - name: نصب JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: نصب Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: بیلد APK نسخه دیباگ
        run: gradle assembleDebug --stacktrace

      - name: آپلود APK به‌عنوان Artifact قابل دانلود
        uses: actions/upload-artifact@v4
        with:
          name: NetMonitor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
